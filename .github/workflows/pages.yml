name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ai-chat-app]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No build step yet: the app is plain HTML/CSS/JS. If one is added later
      # (npm ci && npm run build), run it here and publish its output folder instead.
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html style.css app.js sw.js manifest.webmanifest icons .nojekyll _site/
          sed -i "s/__BUILD_INFO__/$(date -u '+%Y-%m-%d %H:%M UTC') · ${GITHUB_SHA::7}/" _site/app.js
          # Diesel heater Bluetooth app (diesel-heater/README.md)
          mkdir -p _site/diesel-heater
          cp diesel-heater/web-ble/{index.html,protocol.js,sw.js,manifest.webmanifest,icon.svg} _site/diesel-heater/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
